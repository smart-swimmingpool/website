<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Thermometer body tube -->
  <rect x="28" y="8" width="8" height="36" rx="4" fill="#00B4D8" opacity="0.25"/>
  <rect x="29" y="10" width="6" height="32" rx="3" fill="#00B4D8" opacity="0.15"/>
  <!-- Thermometer bulb -->
  <circle cx="32" cy="50" r="8" fill="#FFD60A"/>
  <circle cx="32" cy="50" r="6" fill="#FFB703"/>
  <!-- Mercury column -->
  <rect x="30" y="30" width="4" height="18" rx="2" fill="#FFB703"/>
  <rect x="30" y="44" width="4" height="4" rx="1" fill="#FFD60A"/>
  <!-- Temperature marks -->
  <path d="M22,16 L26,16" fill="none" stroke="#0077B6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M22,22 L26,22" fill="none" stroke="#0077B6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M22,28 L26,28" fill="none" stroke="#0077B6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M22,34 L28,34" fill="none" stroke="#0077B6" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M22,40 L26,40" fill="none" stroke="#0077B6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Water drops -->
  <circle cx="18" cy="52" r="1.5" fill="#90E0EF" opacity="0.5"/>
  <circle cx="46" cy="48" r="1" fill="#90E0EF" opacity="0.4"/>
  <circle cx="16" cy="56" r="1" fill="#90E0EF" opacity="0.3"/>
  <!-- Temperature value -->
  <text x="32" y="36" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="bold" fill="#0077B6">26°C</text>
</svg>

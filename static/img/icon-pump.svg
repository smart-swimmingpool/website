<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Pump body -->
  <circle cx="32" cy="32" r="16" fill="#0077B6" opacity="0.15"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#0077B6" stroke-width="2"/>
  <circle cx="32" cy="32" r="8" fill="#00B4D8" opacity="0.2"/>
  <!-- Impeller blades -->
  <path d="M32,24 L32,18" fill="none" stroke="#0077B6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40,32 L46,32" fill="none" stroke="#0077B6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32,40 L32,46" fill="none" stroke="#0077B6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M24,32 L18,32" fill="none" stroke="#0077B6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38,26 L42,22" fill="none" stroke="#0077B6" stroke-width="2" stroke-linecap="round"/>
  <path d="M38,38 L42,42" fill="none" stroke="#0077B6" stroke-width="2" stroke-linecap="round"/>
  <path d="M26,38 L22,42" fill="none" stroke="#0077B6" stroke-width="2" stroke-linecap="round"/>
  <path d="M26,26 L22,22" fill="none" stroke="#0077B6" stroke-width="2" stroke-linecap="round"/>
  <!-- Center hub -->
  <circle cx="32" cy="32" r="3" fill="#0077B6"/>
  <circle cx="32" cy="32" r="1.5" fill="#CAF0F8"/>
  <!-- Arrow indicating flow direction -->
  <path d="M50,28 L56,32 L50,36" fill="none" stroke="#48CAE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="8" y1="32" x2="16" y2="32" stroke="#48CAE4" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Water droplets -->
  <circle cx="14" cy="30" r="1.5" fill="#90E0EF" opacity="0.5"/>
  <circle cx="14" cy="36" r="1" fill="#90E0EF" opacity="0.4"/>
  <circle cx="52" cy="30" r="1" fill="#90E0EF" opacity="0.4"/>
  <circle cx="52" cy="36" r="1.2" fill="#90E0EF" opacity="0.3"/>
  <!-- Small temperature indicators -->
  <text x="38" y="16" text-anchor="middle" font-family="sans-serif" font-size="4" fill="#48CAE4">~</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="texture-grid" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="transparent"/>
      <!-- Gentle horizontal wave lines -->
      <path d="M0,30 Q25,25 50,30 Q75,35 100,30 Q125,25 150,30 Q175,35 200,30" fill="none" stroke="#90E0EF" stroke-opacity="0.06" stroke-width="1"/>
      <path d="M0,60 Q25,55 50,60 Q75,65 100,60 Q125,55 150,60 Q175,65 200,60" fill="none" stroke="#90E0EF" stroke-opacity="0.04" stroke-width="0.8"/>
      <path d="M0,90 Q25,85 50,90 Q75,95 100,90 Q125,85 150,90 Q175,95 200,90" fill="none" stroke="#CAF0F8" stroke-opacity="0.05" stroke-width="0.7"/>
      <path d="M0,120 Q25,115 50,120 Q75,125 100,120 Q125,115 150,120 Q175,125 200,120" fill="none" stroke="#90E0EF" stroke-opacity="0.03" stroke-width="0.6"/>
      <path d="M0,150 Q25,145 50,150 Q75,155 100,150 Q125,145 150,150 Q175,155 200,150" fill="none" stroke="#CAF0F8" stroke-opacity="0.04" stroke-width="0.8"/>
      <path d="M0,180 Q25,175 50,180 Q75,185 100,180 Q125,175 150,180 Q175,185 200,180" fill="none" stroke="#90E0EF" stroke-opacity="0.03" stroke-width="0.5"/>
      <!-- Tiny dot clusters for subtle caustic effect -->
      <circle cx="40" cy="45" r="3" fill="#CAF0F8" opacity="0.03"/>
      <circle cx="80" cy="20" r="2" fill="#CAF0F8" opacity="0.02"/>
      <circle cx="120" cy="70" r="3.5" fill="#CAF0F8" opacity="0.025"/>
      <circle cx="160" cy="40" r="2.5" fill="#CAF0F8" opacity="0.02"/>
      <circle cx="30" cy="100" r="2" fill="#90E0EF" opacity="0.02"/>
      <circle cx="90" cy="130" r="3" fill="#CAF0F8" opacity="0.025"/>
      <circle cx="150" cy="160" r="2" fill="#CAF0F8" opacity="0.02"/>
      <circle cx="60" cy="170" r="2.5" fill="#90E0EF" opacity="0.015"/>
      <circle cx="170" cy="100" r="2" fill="#CAF0F8" opacity="0.02"/>
      <circle cx="100" cy="170" r="1.5" fill="#CAF0F8" opacity="0.015"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#texture-grid)"/>
</svg>

    - identifier: support
      name: Support
      weight: 5
      params:
        type: dropdown
    - identifier: faq
      parent: support
      name: FAQ
      pageRef: /docs/faq
      weight: 1
    - identifier: troubleshooting
      parent: support
      name: Troubleshooting

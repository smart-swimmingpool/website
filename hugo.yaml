# Configuration for Smart Swimming Pool with Hextra Theme
baseURL: "https://smart-swimmingpool.github.io/"
title: "Smart Swimming Pool"

# Theme
theme: hextra

# Language settings
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: false

removePathAccents: true
summaryLength: 30

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home: [html]
  page: [html]
  section: [html, rss]

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: "Smart Swimming Pool"
    params:
      description: "Open Source Pool Automation - Smart control your swimming pool with home automation"
  de:
    label: Deutsch
    locale: de-DE
    weight: 2
    title: "Smart Swimming Pool"
    params:
      description: "Open Source Pool Automatisierung - Steuere deinen Swimming Pool smart mit Heimautomatisierung"

menu:
  main:
    - identifier: get-started
      name: Get Started
      pageRef: /docs/start-here
      weight: 1
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 2
    - identifier: modules
      name: Modules
      weight: 3
      params:
        type: dropdown
      children:
        - identifier: pool-controller
          name: Pool Controller
          pageRef: /docs/pool-controller
          weight: 1
        - identifier: home-assistant
          name: Home Assistant
          pageRef: /docs/home-assistant-integration
          weight: 2
        - identifier: openhab
          name: openHAB
          pageRef: /docs/openhab-integration
          weight: 3
        - identifier: openhab-config
          name: openHAB Configuration
          pageRef: /docs/openhab-configuration
          weight: 4
        - identifier: pool-monitor
          name: Pool Monitor
          pageRef: /docs/pool-monitor
          weight: 5
        - identifier: grafana
          name: Grafana Dashboard
          pageRef: /docs/grafana-dashboard
          weight: 6
    - identifier: resources
      name: Resources
      weight: 4
      params:
        type: dropdown
      children:
        - identifier: architecture
          name: Architecture
          pageRef: /docs/architecture
          weight: 1
        - identifier: bom
          name: Bill of Materials
          pageRef: /docs/bom
          weight: 2
        - identifier: checklist
          name: Checklist
          pageRef: /docs/checklist
          weight: 3
        - identifier: troubleshooting
          name: Troubleshooting
          pageRef: /docs/troubleshooting
          weight: 4
        - identifier: publications
          name: Publications
          pageRef: /docs/publications
          weight: 5
        - identifier: faq
          name: FAQ
          pageRef: /docs/faq
          weight: 6
    - identifier: community
      name: Community
      weight: 5
      params:
        type: dropdown
      children:
        - identifier: code-of-conduct
          name: Code of Conduct
          pageRef: /code-of-conduct
          weight: 1
        - identifier: contributing
          name: Contributing
          pageRef: /CONTRIBUTING
          weight: 2
        - identifier: changelog
          name: Changelog
          pageRef: /CHANGELOG
          weight: 3
        - identifier: license
          name: License
          pageRef: /license
          weight: 4
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 6
    - name: Search
      weight: 7
      params:
        type: search
    - name: GitHub
      weight: 8
      url: "https://github.com/smart-swimmingpool"
      params:
        icon: github

params:
  description: "\ud83c\udfca Smart Swimming Pool - Open Source Project to manage your Swimming Pool using Home Automation"

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  # Display last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  displayUpdatedAuthor: false

  # Search
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: false

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 20
    article:
      displayPagination: true

  toc:
    displayTags: false

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: wide

  imageZoom:
    enable: true

  comments:
    enable: false

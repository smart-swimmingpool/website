      parent: documentation
      name: Architecture
      pageRef: /docs/architecture
      weight: 4
    - identifier: bom
      parent: documentation
      name: Bill of Materials
      pageRef: /docs/bom
      weight: 5
    - identifier: checklist
      parent: documentation
      name: Commissioning Checklist
      pageRef: /docs/checklist
      weight: 6
    - identifier: components
      name: Components
      weight: 3
      params:
        type: dropdown
    - identifier: pool-controller
      parent: components
      name: Pool Controller
      pageRef: /docs/components/pool-controller
      weight: 1
    - identifier: pool-monitor
      parent: components
      name: Pool Monitor
      pageRef: /docs/components/pool-monitor
      weight: 2
    - identifier: grafana
      parent: components
      name: Grafana Dashboard
      pageRef: /docs/components/grafana-dashboard
      weight: 3
    - identifier: water-quality-monitor
      parent: components

# Configuration for Smart Swimming Pool with Hextra Theme
baseURL: "https://smart-swimmingpool.com/"
title: "Smart Swimming Pool"

# Theme
theme: hextra

# Language settings
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: false

removePathAccents: true
summaryLength: 30

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home: [html]
  page: [html]
  section: [html, rss]

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: "Smart Swimming Pool"
    params:
      description: "Open Source Pool Automation - Smart control your swimming pool with home automation"
  de:
    label: Deutsch
    locale: de-DE
    weight: 2
    title: "Smart Swimming Pool"
    params:
      description: "Open Source Pool Automatisierung - Steuere deinen Swimming Pool smart mit Heimautomatisierung"

menu:
  main:
    - identifier: get-started
      name: Get Started
      pageRef: /docs/start-here
      weight: 1
    - identifier: documentation
      name: Documentation
      weight: 2
      params:
        type: dropdown
    - identifier: docs-overview
      parent: documentation
      name: Overview
      pageRef: /docs
      weight: 1
    - identifier: quickstart
      parent: documentation
      name: Quick Start
      pageRef: /docs/quickstart
      weight: 2

      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: "https://github.com/smart-swimmingpool"
      params:
        icon: github

params:
  description: "🏊 Smart Swimming Pool - Open Source Project to manage your Swimming Pool using Home Automation"

  # Build-time diagram rendering (```svgbob blocks); point url to a self-hosted Kroki if preferred
  kroki:
    url: "https://kroki.io"

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  # Display last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  displayUpdatedAuthor: false

  # Search
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: false

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 20
    article:
      displayPagination: true

  toc:
    displayTags: false

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: wide

  imageZoom:
    enable: true

  comments:
    enable: false

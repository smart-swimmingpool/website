name: PR Check
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

# Avoid duplicate runs for the same branch. pull_request uses github.head_ref while
# push uses github.ref_name, so both events collapse into the same concurrency group.
concurrency:
  group: check-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Cache module repositories
        uses: actions/cache@v6
        with:
          path: temp
          key: module-repos-v1-${{ runner.os }}-${{ hashFiles('multiversion.yml') }}
          restore-keys: |
            module-repos-v1-${{ runner.os }}-

      - name: Merge documentation from module repositories
        run: python ./grabrepos.py

      - name: Build Hugo site
        run: hugo --minify

      - name: Start HTTP server for link checking
        run: |
          python3 -m http.server 1313 --directory public &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          sleep 2

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --exclude-all-private
            --exclude 'https?://github\.com/smart-swimmingpool/[^/]+/blob/main/docs/'
            --exclude '^https?://www\.home-assistant\.io'
            --exclude '^https?://code\.visualstudio\.com'
            --exclude '^https?://mosquitto\.org'
            --exclude '^https?://www\.silabs\.com'
            --exclude '^https?://www\.wch\.cn'
            --exclude '^https?://www\.arduino\.cc'
            --exclude '^https?://github\.com/espressif/arduino-esp32'
            --exclude '^https?://platformio\.org'
            http://localhost:1313/
          fail: true
          output: /tmp/lychee-report.md

      - name: Stop HTTP server
        if: always()
        run: kill ${{ env.SERVER_PID }} 2>/dev/null || true

      - name: Upload link check report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: /tmp/lychee-report.md

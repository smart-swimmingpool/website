name: CI
on:
  push:
    branches:
      - main
  schedule:
    # Daily rebuild at 6:00 UTC — picks up new module docs automatically
    - cron: '0 6 * * *'
  repository_dispatch:
    types: [doc_update]
  workflow_dispatch:
    # Allow manual trigger via GitHub UI

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Cache module repositories
        uses: actions/cache@v6
        with:
          path: temp
          key: module-repos-v1-${{ runner.os }}-${{ hashFiles('multiversion.yml') }}
          restore-keys: |
            module-repos-v1-${{ runner.os }}-

      - name: Merge Documentation of Modules
        run: python ./grabrepos.py

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.HUGO_DEPLOY_TOKEN }}
          external_repository: smart-swimmingpool/smart-swimmingpool.github.io
          publish_dir: ./public
          user_name: stritti
          user_email: stritti@users.noreply.github.com
          publish_branch: main

name: CI
on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [doc_update]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Update theme
        # (Optional)If you have the theme added as submodule, you can pull it and use the most updated version
        run: git submodule update --init --recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          # This path is specific to Ubuntu
          path: ~/.cache/pip
          # Look to see if there is a cache hit for the corresponding requirements file
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Academic theme requires Hugo < 0.120.0 (site.GoogleAnalytics removed in 0.120+)
          hugo-version: '0.119.0'
          extended: true

      - name: Merge Documentation of Modules
        run: python ./grabrepos.py

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.HUGO_DEPLOY_TOKEN }}
          external_repository: smart-swimmingpool/smart-swimmingpool.github.io
          publish_dir: ./public
          user_name: stritti
          user_email: stritti@users.noreply.github.com
          publish_branch: master

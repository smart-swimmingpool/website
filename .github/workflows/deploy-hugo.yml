name: CI
on:
  push:
    branches:
      - main
  schedule:
    # Daily rebuild at 6:00 UTC — picks up new module docs automatically
    - cron: '0 6 * * *'
  repository_dispatch:
    types: [doc_update]
  workflow_dispatch:
    # Allow manual trigger via GitHub UI
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Cache pip
        uses: actions/cache@v6
        with:
          # This path is specific to Ubuntu
          path: ~/.cache/pip
          # Look to see if there is a cache hit for the corresponding requirements file
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-${{ hashFiles('**/**.md', '**/**.toml', '**/**.yaml', '**/**.json') }}
          restore-keys: |
            hugo-

      - name: Merge Documentation of Modules
        run: python ./grabrepos.py

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.HUGO_DEPLOY_TOKEN }}
          external_repository: smart-swimmingpool/smart-swimmingpool.github.io
          publish_dir: ./public
          user_name: stritti
          user_email: stritti@users.noreply.github.com
          publish_branch: master

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily rebuild at 6:00 UTC — picks up new module docs automatically
    - cron: '0 6 * * *'
  repository_dispatch:
    types: [doc_update]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (a new push cancels the old run). Runs on main are never cancelled,
# so every merge is deployed; a newer queued run replaces an older queued one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PRs lint only the changed files, everything else lints the whole repository
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}

  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Cache module repositories
        uses: actions/cache@v6
        with:
          path: temp
          key: module-repos-v1-${{ runner.os }}-${{ hashFiles('multiversion.yml') }}
          restore-keys: |
            module-repos-v1-${{ runner.os }}-

      - name: Merge documentation from module repositories
        run: python ./grabrepos.py

      - name: Build Hugo site
        run: hugo --minify

      # The link check runs on PRs only: broken links should block a change,
      # but must not block the daily deploy.
      - name: Start HTTP server for link checking
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 1313 --directory public >/tmp/http-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in {1..20}; do
            if curl --fail --silent http://localhost:1313/ >/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          cat /tmp/http-server.log
          exit 1

      - name: Check for broken links
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --exclude-all-private
            --exclude 'https?://github\.com/smart-swimmingpool/[^/]+/blob/main/docs/'
            --exclude '^https?://www\.home-assistant\.io'
            --exclude '^https?://code\.visualstudio\.com'
            --exclude '^https?://mosquitto\.org'
            --exclude '^https?://www\.silabs\.com'
            --exclude '^https?://www\.wch\.cn'
            --exclude '^https?://www\.arduino\.cc'
            --exclude '^https?://github\.com/espressif/arduino-esp32'
            --exclude '^https?://platformio\.org'
            http://localhost:1313/
          fail: true
          output: /tmp/lychee-report.md

      - name: Stop HTTP server
        if: always() && github.event_name == 'pull_request'
        run: kill ${{ env.SERVER_PID }} 2>/dev/null || true

      - name: Upload link check report
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: /tmp/lychee-report.md

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.HUGO_DEPLOY_TOKEN }}
          external_repository: smart-swimmingpool/smart-swimmingpool.github.io
          publish_dir: ./public
          user_name: stritti
          user_email: stritti@users.noreply.github.com
          publish_branch: main
